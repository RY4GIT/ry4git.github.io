    <script>
        /* Leaflet 1.8+ removed L.DomEvent.fakeStop / _fakeStop; VectorGrid 1.3.x still calls it on
           canvas tile clicks, which throws and prevents any feature click from firing. */
        (function () {
            if (!L || !L.DomEvent) return;
            function fakeStop(e) {
                if (e && e.stopPropagation) e.stopPropagation();
                if (e && e.preventDefault) e.preventDefault();
            }
            if (typeof L.DomEvent.fakeStop !== 'function') L.DomEvent.fakeStop = fakeStop;
            if (typeof L.DomEvent._fakeStop !== 'function') L.DomEvent._fakeStop = fakeStop;
        })();

<body>

<h1 class="sig-page-title">&#127754; Dominant Processes Inferred from Hydrologic Signatures</h1>

<div id="search-container">
    <input type="text" id="gaugeIdSearchInput" placeholder="Gauge ID (substring match)">
    <button type="button" id="gaugeIdSearchButton">Search</button>
</div>

<div id="map"></div>

<script>
    if (typeof L === 'undefined' || !L.vectorGrid || !L.vectorGrid.slicer) {
        document.getElementById('map').innerHTML = '<p style="padding:1em;">Leaflet.VectorGrid failed to load. Check the network or CDN.</p>';
        throw new Error('Leaflet.VectorGrid unavailable');
    }

    /* Leaflet joins attribution strings with ", "; use "|" between every segment (match prefix↔body separator). */
    (function () {
        var pipeSep = ' <span aria-hidden="true">|</span> ';
        L.Control.Attribution.prototype._update = function () {
            if (!this._map) { return; }
            var attribs = [];
            for (var k in this._attributions) {
                if (this._attributions[k]) {
                    attribs.push(k);
                }
            }
            var parts = [];
            if (this.options.prefix) {
                parts.push(this.options.prefix);
            }
            if (attribs.length) {
                parts.push(attribs.join(pipeSep));
            }
            this._container.innerHTML = parts.join(pipeSep);
        };
    }());

    var map = L.map('map').setView([39.8283, -98.5795], 4);

    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });
    var esriSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });
    osmLayer.addTo(map);

    var paperAttribution = 'Araki, R., Holt, A., Hammond, J. C., Husic, A., Coxon, G., and McMillan, H. K.: Continental-scale prediction of hydrologic signatures and processes, EGUsphere [preprint], <a href="https://doi.org/10.5194/egusphere-2025-6156" target="_blank" rel="noopener">https://doi.org/10.5194/egusphere-2025-6156</a>, 2025.';
    var caravanCredit = 'Watershed shapes from <a href="https://doi.org/10.5281/zenodo.10968468" target="_blank" rel="noopener">Caravan v1.4 (Kratzert et al., 2024)</a> and <a href="https://doi.org/10.3133/70046617" target="_blank" rel="noopener">GAGES-II (Falcone et al., 2010)</a>; simplified for visualization.';
    map.attributionControl.addAttribution(paperAttribution);
    map.attributionControl.addAttribution(caravanCredit);

    /* While a popup is open, disable map dragging so pointer moves do not pan the map (stuck drag). */
    map.on('popupopen', function () {
        map.dragging.disable();
    });
    map.on('popupclose', function () {
        map.dragging.enable();
    });

    var baseMaps = {
        "OpenStreetMap": osmLayer,
        "Satellite": esriSatelliteLayer
    };

    var SOURCE_LABELS = {
        obs_Caravan: 'Observed (Caravan dataset)',
        obs_GAGES2: 'Observed (GAGES-II dataset)',
        pred_hys_gg2: 'Predicted (random forest, Caravan + GAGES-II attributes)',
        pred_hys: 'Predicted (random forest, Caravan attributes)',
        pred_gg2: 'Predicted (random forest, Caravan + GAGES-II attributes)'
    };

    var META_KEYS = {
        gauge_id: true,
        gauge_num: true,
        gauge_name: true,
        source: true,
        color: true,
        bivariate_class: true,
        dominance: true,
        order: true,
        baseflow_dominance: true,
        high_storage_capacity_dominance: true,
        overland_flow_dominance: true,
        water_balance_losses_dominance: true,
        unclassified: true,
        both_dominant: true,
        Group_max: true
    };

    /**
     * Plain-text name for the SHAP / Group_max overlay (must match layerSpecs label).
     * Leaflet layer control does not render HTML in names — use a two-line title in the popup only.
     */
    var SHAP_GROUP_MAX_LAYER_LABEL = 'Influential attributes (random forest)';

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatValue(v) {
        if (v == null || v === '') return '—';
        if (typeof v === 'number' && isFinite(v)) {
            if (Number.isInteger(v)) return String(v);
            var t = v.toFixed(5);
            return t.replace(/\.?0+$/, '');
        }
        return String(v);
    }

    function formatPercentile(v) {
        if (v == null || v === '') return '—';
        if (typeof v === 'number' && isFinite(v)) return v.toFixed(2);
        return String(v);
    }

    function sourceDisplay(props) {
        var code = props && props.source;
        if (code == null || code === '') return '—';
        var label = SOURCE_LABELS[code];
        if (label) {
            return escapeHtml(label);
        }
        return escapeHtml(formatValue(code));
    }

    /* Units from signature / process table (EGUsphere preprint). */
    var SIGNATURE_UNITS_BY_LAYER = {
        'Baseflow': {
            BFI: ' [-]',
            BaseflowRecessionK: ' [1/day]'
        },
        'High storage capacity': {
            RecessionParameters_b: ' [-]',
            AverageStorage: ' [mm]'
        },
        'Water balance losses': {
            TotalRR: ' [-]',
            EventRR: ' [-]'
        },
        'Seasonal variability': {
            VariabilityIndex: ' [-]',
            Recession_a_Seasonality: ' [-]'
        },
        'Overland flow': {
            avg_IE_SE_signif: ' [-]',
            avg_IE_SE_thresh: ' [mm]',
            SE_thresh_signif: ' [-]',
            IE_thresh_signif: ' [-]',
            IE_thresh: ' [mm]',
            SE_thresh: ' [mm]'
        },
        'Overland flow type': {
            R_Pint_RC: ' [-]',
            R_Pvol_RC: ' [-]',
            diff_RCPint_RCPvol: ' [-]'
        }
    };

    function signatureValueHtml(layerLabel, propKey, rawValue) {
        var unit = '';
        var layerMap = SIGNATURE_UNITS_BY_LAYER[layerLabel];
        if (layerMap && layerMap[propKey]) unit = layerMap[propKey];
        return escapeHtml(formatValue(rawValue)) + escapeHtml(unit);
    }

    function colorFromProps(properties) {
        var raw = properties && properties.color;
        var c = (typeof raw === 'string' && raw.trim()) ? raw.trim() : '#3388ff';
        if (c.charAt(0) !== '#') c = '#' + c;
        return c;
    }

    function pathStyleFromProps(properties) {
        var c = colorFromProps(properties);
        return {
            stroke: true,
            fill: true,
            color: c,
            weight: 1.25,
            opacity: 0.95,
            fillColor: c,
            fillOpacity: 0.2
        };
    }

    /* Matplotlib named colors */
    var MPL_ROYALBLUE = '#4169E1';
    var MPL_LIGHTCORAL = '#F08080';
    var MPL_DIMGREY = '#696969';
    /** Darker than MPL_DIMGREY — hatch diagonals read more clearly on fills. */
    var MPL_DIMGREY_HATCH_STROKE = '#696969';
    var MPL_LIGHTGRAY = '#D3D3D3';

    /** Cross-process: stronger fills for baseflow / overland / both_dominant (higher alpha). */
    var CROSS_FILL_OPACITY_DOMINANT = 0.7;
    var CROSS_FILL_OPACITY_UNCLASSIFIED = 0.1;
    var CROSS_FILL_OPACITY_NEUTRAL = 0.1;
    var CROSS_FILL_OPACITY_HATCH_DOMINANT = 0.48;
    var CROSS_FILL_OPACITY_HATCH_OTHER = 0.28;

    function hexToRgb(hex) {
        var h = (hex || '').replace('#', '');
        if (h.length === 3) {
            h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        }
        if (h.length !== 6) return { r: 220, g: 220, b: 220 };
        return {
            r: parseInt(h.slice(0, 2), 16),
            g: parseInt(h.slice(2, 4), 16),
            b: parseInt(h.slice(4, 6), 16)
        };
    }

    function rgbToHex(r, g, b) {
        function x(n) {
            var v = Math.round(Math.min(255, Math.max(0, n)));
            var s = v.toString(16);
            return s.length === 1 ? '0' + s : s;
        }
        return '#' + x(r) + x(g) + x(b);
    }

    function blendHexColors(hexA, hexB) {
        var a = hexToRgb(hexA);
        var b = hexToRgb(hexB);
        return rgbToHex((a.r + b.r) / 2, (a.g + b.g) / 2, (a.b + b.b) / 2);
    }

    /** Hatch drawn on top of a solid base fill (canvas pattern, cached per base hex). */
    var _crossHatchPatternCache = {};
    function getCrossProcessHatchPattern(baseHex) {
        var key = (baseHex || '_default') + '_hstroke2';
        if (_crossHatchPatternCache[key]) return _crossHatchPatternCache[key];
        var rgb = hexToRgb(baseHex || '#f5f5f5');
        var w = 22;
        var h = 22;
        var c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = 'rgb(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ')';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = MPL_DIMGREY_HATCH_STROKE;
        ctx.lineWidth = 1;
        ctx.lineCap = 'square';
        var step = 8;
        for (var o = -w; o <= w + h; o += step) {
            ctx.beginPath();
            ctx.moveTo(o, 0);
            ctx.lineTo(o + h, h);
            ctx.stroke();
        }
        _crossHatchPatternCache[key] = ctx.createPattern(c, 'repeat');
        return _crossHatchPatternCache[key];
    }

    /** Tri-state: true / false / null (missing or unknown). */
    function parseDominanceBool(v) {
        if (v === true || v === 1) return true;
        if (v === false || v === 0) return false;
        if (v === null || v === undefined || v === '') return null;
        var s = String(v).trim().toLowerCase();
        if (s === '1' || s === 'true' || s === 'yes') return true;
        if (s === '0' || s === 'false' || s === 'no') return false;
        return null;
    }

    /**
     * Hatch when water_balance_losses_dominance is strictly false (losses not dominant).
     * No hatch when strictly true (losses dominant). Unknown/missing → no hatch.
     */
    function waterBalanceLossesHatchActive(properties) {
        return parseDominanceBool(properties && properties.water_balance_losses_dominance) === false;
    }

    var CROSS_PROCESS_DOMINANCE_KEYS = [
        'baseflow_dominance',
        'high_storage_capacity_dominance',
        'overland_flow_dominance',
        'water_balance_losses_dominance',
        'unclassified',
        'both_dominant'
    ];

    function normalizeCrossProcessDominanceProps(geojson) {
        if (!geojson || !geojson.features) return;
        for (var fi = 0; fi < geojson.features.length; fi++) {
            var p = geojson.features[fi].properties;
            if (!p) continue;
            for (var ki = 0; ki < CROSS_PROCESS_DOMINANCE_KEYS.length; ki++) {
                var key = CROSS_PROCESS_DOMINANCE_KEYS[ki];
                if (!Object.prototype.hasOwnProperty.call(p, key)) continue;
                var t = parseDominanceBool(p[key]);
                if (t === true) p[key] = true;
                else if (t === false) p[key] = false;
                else p[key] = null;
            }
        }
    }

    /**
     * Cross-process layer: blended fill when both_dominant is true; else baseflow / overland singly;
     * light gray when unclassified is true;
     * diagonal hatch when water_balance_losses_dominance is false (no hatch when true);
     * black stroke on top when high_storage_capacity_dominance is true.
     */
    function crossProcessStyleFromProps(properties) {
        var bf = parseDominanceBool(properties && properties.baseflow_dominance);
        var ol = parseDominanceBool(properties && properties.overland_flow_dominance);
        var hs = parseDominanceBool(properties && properties.high_storage_capacity_dominance);
        var uncl = parseDominanceBool(properties && properties.unclassified) === true;

        var hsTrue = hs === true;
        var wbHatch = waterBalanceLossesHatchActive(properties);
        var olTrue = ol === true;
        var bfTrue = bf === true;
        var bothDominant = parseDominanceBool(properties && properties.both_dominant) === true;

        var baseHex;
        if (uncl) {
            baseHex = MPL_LIGHTGRAY;
        } else if (bothDominant) {
            baseHex = blendHexColors(MPL_ROYALBLUE, MPL_LIGHTCORAL);
        } else if (bfTrue) {
            baseHex = MPL_ROYALBLUE;
        } else if (olTrue) {
            baseHex = MPL_LIGHTCORAL;
        } else {
            baseHex = '#dedede';
        }

        var domFillStrong = bothDominant || bfTrue || olTrue;
        var fillOp = uncl ? CROSS_FILL_OPACITY_UNCLASSIFIED : (domFillStrong ? CROSS_FILL_OPACITY_DOMINANT : CROSS_FILL_OPACITY_NEUTRAL);

        var s = {
            stroke: true,
            fill: true,
            opacity: 0.95,
            fillOpacity: fillOp,
            fillColor: baseHex,
            color: baseHex,
            weight: 1.25
        };

        if (wbHatch) {
            s.fillColor = getCrossProcessHatchPattern(baseHex);
            s.fillOpacity = uncl
                ? CROSS_FILL_OPACITY_UNCLASSIFIED
                : (domFillStrong ? CROSS_FILL_OPACITY_HATCH_DOMINANT : CROSS_FILL_OPACITY_HATCH_OTHER);
        }

        if (hsTrue) {
            s.color = '#000000';
            s.weight = 2.75;
            s.opacity = 1;
        } else if (wbHatch) {
            s.color = MPL_DIMGREY_HATCH_STROKE;
            s.weight = 2.25;
            s.opacity = 1;
        }

        return s;
    }

    /** Plain Yes/No for popups: only explicit true → Yes, else No. */
    function layYesNoDominance(v) {
        return parseDominanceBool(v) === true ? 'Yes' : 'No';
    }

    /**
     * Water balance losses dominance line: Yes iff true, No iff false (matches hatch rule).
     * Missing/invalid values show — (no hatch in that case).
     */
    function waterBalanceLossesDominanceYesNo(v) {
        var t = parseDominanceBool(v);
        if (t === true) return 'Yes';
        if (t === false) return 'No';
        return '—';
    }

    function buildPopupHtml(layerLabel, props) {
        if (!props) return '<p>No properties</p>';
        var keys = Object.keys(props);
        var percKeys = keys.filter(function (k) { return k.length > 5 && k.slice(-5) === '_perc'; });
        var used = {};

        var parts = [];
        parts.push('<div class="sig-popup">');
        if (layerLabel === SHAP_GROUP_MAX_LAYER_LABEL) {
            parts.push('<p><strong>Most influential attributes across all processes<br>(random forest, Shapley analysis)</strong></p>');
        } else {
            parts.push('<p><strong>' + escapeHtml(layerLabel) + '</strong></p>');
        }

        if (layerLabel === 'Cross-process dominance') {
            parts.push('<div class="sig-popup-lay">');
            parts.push('<p>Is Baseflow dominant: ' + escapeHtml(layYesNoDominance(props.baseflow_dominance)) + '</p>');
            parts.push('<p>Is Overland Flow dominant: ' + escapeHtml(layYesNoDominance(props.overland_flow_dominance)) + '</p>');
            parts.push('<p>Is Storage Capacity high: ' + escapeHtml(layYesNoDominance(props.high_storage_capacity_dominance)) + '</p>');
            parts.push('<p>Is Water Balance Losses dominant? ' + escapeHtml(waterBalanceLossesDominanceYesNo(props.water_balance_losses_dominance)) + '</p>');
            parts.push('</div>');
        }

        if (layerLabel === SHAP_GROUP_MAX_LAYER_LABEL) {
            parts.push('<p><strong>gauge_id</strong>: ' + escapeHtml(formatValue(props.gauge_id)) + '</p>');
            parts.push('<p><strong>Group_max</strong>: ' + escapeHtml(formatValue(props.Group_max)) + '</p>');
            used.gauge_id = true;
            used.Group_max = true;
            used.color = true;
            parts.push('</div>');
            return parts.join('');
        }

        percKeys.forEach(function (percKey) {
            var baseKey = percKey.slice(0, -5);
            if (META_KEYS[baseKey] || META_KEYS[percKey]) return;
            used[baseKey] = true;
            used[percKey] = true;
            parts.push('<p><strong>' + escapeHtml(baseKey) + '</strong><br>');
            parts.push('Value: ' + signatureValueHtml(layerLabel, baseKey, props[baseKey]) + '<br>');
            parts.push('Percentile: ' + escapeHtml(formatPercentile(props[percKey])) + '</p>');
        });

        keys.forEach(function (k) {
            if (META_KEYS[k] || used[k] || k.slice(-5) === '_perc') return;
            parts.push('<p><strong>' + escapeHtml(k) + '</strong>: ' + signatureValueHtml(layerLabel, k, props[k]) + '</p>');
        });

        parts.push('<div class="meta">');
        parts.push('<strong>gauge_id</strong>: ' + escapeHtml(formatValue(props.gauge_id)) + '<br>');
        parts.push('<strong>gauge_name</strong>: ' + escapeHtml(formatValue(props.gauge_name)) + '<br>');
        parts.push('<strong>source</strong>: ' + sourceDisplay(props));
        parts.push('</div></div>');
        return parts.join('');
    }

    var layerSpecs = [
        {
            label: 'Cross-process dominance',
            path: '../assets/shp/sig_us/sigs_cross_process_dominance.geojson',
            legendIsHtml: true,
            isCrossProcess: true
        },
        { label: 'Baseflow', path: '../assets/shp/sig_us/sigs_Baseflow.geojson', legend: '../assets/shp/sig_us/legend_baseflow.png', legendAlt: 'Baseflow (BFI × baseflow recession) bivariate legend' },
        { label: 'Overland flow', path: '../assets/shp/sig_us/sigs_OverlandFlow.geojson', legend: '../assets/shp/sig_us/legend_overland.png', legendAlt: 'Overland flow bivariate legend' },
        { label: 'Overland flow type', path: '../assets/shp/sig_us/sigs_OverlandFlowType.geojson', legend: '../assets/shp/sig_us/legend_overland_type.png', legendAlt: 'Overland flow type legend' },
        { label: 'Water balance losses', path: '../assets/shp/sig_us/sigs_WaterBalanceLosses.geojson', legend: '../assets/shp/sig_us/legend_waterbalance.png', legendAlt: 'Water balance losses bivariate legend' },
        { label: 'High storage capacity', path: '../assets/shp/sig_us/sigs_HighStorageCapacity.geojson', legend: '../assets/shp/sig_us/legend_storage.png', legendAlt: 'High storage capacity bivariate legend' },
        { label: 'Seasonal variability', path: '../assets/shp/sig_us/sigs_SeasonalVariability.geojson', legend: '../assets/shp/sig_us/legend_season.png', legendAlt: 'Seasonal variability bivariate legend' },
        {
            label: SHAP_GROUP_MAX_LAYER_LABEL,
            path: '../assets/shp/sig_us/shap_most_important_cat_in_map_all_processes.geojson',
            legendIsHtml: true,
            legendKind: 'groupMax'
        }
    ];

    var overlayMaps = {};
    var initialExtentBounds = null;
    var initialExtentRefitScheduled = false;
    var loadedSigLayers = [];
    var lastSearchHighlights = [];

    var INITIAL_FIT_OPTIONS = { padding: [40, 40] };

    function applyInitialExtentFit() {
        if (!initialExtentBounds || !initialExtentBounds.isValid()) return;
        map.invalidateSize();
        map.fitBounds(initialExtentBounds, INITIAL_FIT_OPTIONS);
    }

    function scheduleInitialExtentRefit() {
        if (initialExtentRefitScheduled) return;
        initialExtentRefitScheduled = true;
        function afterLayout() {
            applyInitialExtentFit();
        }
        requestAnimationFrame(function () {
            requestAnimationFrame(afterLayout);
        });
        window.addEventListener('load', function onWinLoad() {
            window.removeEventListener('load', onWinLoad);
            setTimeout(afterLayout, 120);
        });
        setTimeout(afterLayout, 350);
    }

    /** First of Baseflow or Cross-process dominance to finish loading sets initial map extent. */
    function trySetInitialExtentFromGeojson(geojson) {
        if (initialExtentBounds) return;
        try {
            var tmp = L.geoJSON(geojson);
            var b = tmp.getBounds();
            if (!b.isValid()) return;
            initialExtentBounds = b.pad(0.02);
            applyInitialExtentFit();
            scheduleInitialExtentRefit();
        } catch (e) { /* ignore */ }
    }

    function ringCentroid(ring) {
        var x = 0, y = 0, n = ring.length;
        if (!n) return null;
        for (var i = 0; i < n; i++) {
            x += ring[i][0];
            y += ring[i][1];
        }
        return L.latLng(y / n, x / n);
    }

    function featureCentroidLatLng(feature) {
        var g = feature && feature.geometry;
        if (!g) return null;
        if (g.type === 'Polygon') return ringCentroid(g.coordinates[0]);
        if (g.type === 'MultiPolygon' && g.coordinates[0] && g.coordinates[0][0]) {
            return ringCentroid(g.coordinates[0][0]);
        }
        return null;
    }

    function resetSearchHighlight() {
        lastSearchHighlights.forEach(function (h) {
            try {
                h.vectorLayer.resetFeatureStyle(h.id);
            } catch (err) { /* ignore */ }
        });
        lastSearchHighlights = [];
    }

    function makeSearchHighlightStyleFn(styleFn) {
        return function (properties, zoom) {
            var s = styleFn(properties, zoom);
            var hatch = waterBalanceLossesHatchActive(properties);
            var outlineOnly = !hatch && s.fillOpacity === 0;
            s.weight = Math.max(s.weight || 1, 4);
            s.opacity = 1;
            s.color = '#b71c1c';
            if (hatch) {
                s.fillOpacity = Math.min(1, (s.fillOpacity != null ? s.fillOpacity : 1) * 0.55);
            } else if (outlineOnly) {
                s.fillColor = '#ffeb3b';
                s.fillOpacity = 0.5;
            } else {
                s.fillOpacity = Math.min(0.58, Math.max(0.22, (s.fillOpacity != null ? s.fillOpacity : 0.2) + 0.12));
            }
            return s;
        };
    }

    function hasActiveSigLayer() {
        for (var li = 0; li < layerSpecs.length; li++) {
            var g = overlayMaps[layerSpecs[li].label];
            if (g && map.hasLayer(g)) return true;
        }
        return false;
    }

    var legendWrapEl = null;
    var legendImagesEl = null;

    function activeSignatureSpecs() {
        var out = [];
        for (var li = 0; li < layerSpecs.length; li++) {
            var spec = layerSpecs[li];
            var g = overlayMaps[spec.label];
            if (g && map.hasLayer(g)) out.push(spec);
        }
        return out;
    }

    function appendCrossProcessLegend(parentEl) {
        var root = L.DomUtil.create('div', 'sig-legend-cross-process', parentEl);
        function row(swClass, text) {
            var r = L.DomUtil.create('div', 'sig-cp-row', root);
            var sw = L.DomUtil.create('span', 'sig-cp-sw ' + swClass, r);
            r.appendChild(document.createTextNode(text));
        }
        row('sig-cp-fill-royalblue', 'Baseflow is dominant');
        row('sig-cp-fill-lightcoral', 'Overland flow is dominant');
        row('sig-cp-fill-blended', 'Both baseflow and overland are dominant');
        row('sig-cp-fill-lightgray', 'Unclassified');
        row('sig-cp-hatch-on-fill', 'Water balance losses not dominant');
        row('sig-cp-outline-black', 'High storage capacity');
        return root;
    }

    function collectGroupMaxLegendRows(geojson) {
        var seen = {};
        var out = [];
        var feats = geojson && geojson.features;
        if (!feats) return out;
        for (var i = 0; i < feats.length; i++) {
            var p = feats[i].properties;
            if (!p) continue;
            var label = p.Group_max != null && String(p.Group_max).trim() !== '' ? String(p.Group_max) : '—';
            var hex = colorFromProps(p);
            var key = label + '\0' + hex;
            if (seen[key]) continue;
            seen[key] = true;
            out.push({ label: label, color: hex });
        }
        out.sort(function (a, b) {
            return a.label.localeCompare(b.label);
        });
        return out;
    }

    function appendGroupMaxLegend(parentEl, rows) {
        var root = L.DomUtil.create('div', 'sig-legend-cross-process sig-legend-group-max', parentEl);
        var title = L.DomUtil.create('div', '', root);
        title.style.fontWeight = '600';
        title.style.marginBottom = '6px';
        title.textContent = 'Group_max';
        var list = rows && rows.length ? rows : [];
        for (var i = 0; i < list.length; i++) {
            var r = L.DomUtil.create('div', 'sig-cp-row', root);
            var sw = L.DomUtil.create('span', 'sig-cp-sw', r);
            sw.style.backgroundColor = list[i].color;
            sw.style.border = '1px solid rgba(0, 0, 0, 0.35)';
            r.appendChild(document.createTextNode(list[i].label));
        }
        return root;
    }

    function updateSignatureLegendVisibility() {
        if (!legendWrapEl || !legendImagesEl) return;
        var active = activeSignatureSpecs();
        if (!active.length) {
            legendWrapEl.style.display = 'none';
            return;
        }
        while (legendImagesEl.firstChild) {
            legendImagesEl.removeChild(legendImagesEl.firstChild);
        }
        for (var i = 0; i < active.length; i++) {
            var spec = active[i];
            if (spec.legendIsHtml && spec.legendKind === 'groupMax') {
                appendGroupMaxLegend(legendImagesEl, spec._groupMaxLegendRows);
            } else if (spec.legendIsHtml) {
                appendCrossProcessLegend(legendImagesEl);
            } else {
                var im = L.DomUtil.create('img', '', legendImagesEl);
                im.src = spec.legend;
                im.alt = spec.legendAlt || spec.label;
            }
        }
        legendWrapEl.style.display = 'block';
    }

    function findGaugeMatch(searchTerm) {
        var byLabel = {};
        for (var u = 0; u < loadedSigLayers.length; u++) {
            byLabel[loadedSigLayers[u].label] = loadedSigLayers[u];
        }
        for (var li = 0; li < layerSpecs.length; li++) {
            var entry = byLabel[layerSpecs[li].label];
            if (!entry || !entry.data || !entry.data.features) continue;
            if (!map.hasLayer(entry.group)) continue;
            var feats = entry.data.features;
            for (var j = 0; j < feats.length; j++) {
                var f = feats[j];
                var gid = f.properties && f.properties.gauge_id;
                if (gid != null && String(gid).toLowerCase().indexOf(searchTerm) !== -1) {
                    return { entry: entry, feature: f, gaugeId: String(gid) };
                }
            }
        }
        return null;
    }

    function performGaugeSearch() {
        var searchTerm = document.getElementById('gaugeIdSearchInput').value.trim().toLowerCase();
        if (!searchTerm) {
            alert('Please enter a gauge_id (or substring) to search.');
            return;
        }
        if (!loadedSigLayers.length) {
            alert('Layers have not finished loading yet. Please wait and try again.');
            return;
        }
        if (!hasActiveSigLayer()) {
            alert('Turn on at least one signature layer in the layer control, then search.');
            return;
        }

        var match = findGaugeMatch(searchTerm);

        if (!match) {
            alert('No gauge_id matched in the visible (checked) layers.');
            return;
        }

        resetSearchHighlight();

        var ll = featureCentroidLatLng(match.feature);
        if (ll) {
            map.setView(ll, 12);
        }

        loadedSigLayers.forEach(function (lyr) {
            if (!map.hasLayer(lyr.group)) return;
            var has = false;
            var feats = lyr.data && lyr.data.features;
            if (!feats) return;
            for (var k = 0; k < feats.length; k++) {
                if (feats[k].properties && String(feats[k].properties.gauge_id) === match.gaugeId) {
                    has = true;
                    break;
                }
            }
            if (!has) return;
            var baseFn = lyr.isCrossProcess ? crossProcessStyleFromProps : pathStyleFromProps;
            lyr.vectorLayer.setFeatureStyle(match.gaugeId, makeSearchHighlightStyleFn(baseFn));
            lastSearchHighlights.push({ vectorLayer: lyr.vectorLayer, id: match.gaugeId });
        });

        var p = match.feature.properties;
        L.popup({ maxWidth: 340, autoPan: true, keepInView: true })
            .setLatLng(ll || map.getCenter())
            .setContent(buildPopupHtml(match.entry.label, p))
            .openOn(map);
    }

    var vectorTileLayerName = 'sliced';

    /** Large GeoJSON files often fail with truncated bodies → JSON "Unexpected end of input". */
    var GEOJSON_FETCH_RETRIES = 4;
    var GEOJSON_FETCH_RETRY_DELAY_MS = 700;

    function delayPromise(ms) {
        return new Promise(function (resolve) {
            setTimeout(resolve, ms);
        });
    }

    function fetchGeoJsonWithRetries(path) {
        function once(attempt) {
            var url = attempt > 1
                ? path + (path.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now() + '&_try=' + attempt
                : path;
            return fetch(url, { credentials: 'same-origin' })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error(path + ': HTTP ' + response.status + ' ' + response.statusText);
                    }
                    return response.text();
                })
                .then(function (text) {
                    if (text == null || String(text).trim() === '') {
                        throw new Error(path + ': empty response body');
                    }
                    try {
                        return JSON.parse(text);
                    } catch (pe) {
                        var msg = (pe && pe.message) ? pe.message : 'JSON parse error';
                        throw new Error(msg + ' - received ' + text.length + ' characters (file may be truncated or not JSON)');
                    }
                })
                .catch(function (err) {
                    if (attempt >= GEOJSON_FETCH_RETRIES) {
                        throw err;
                    }
                    console.warn('GeoJSON fetch attempt ' + attempt + ' failed for ' + path + ':', err.message || err);
                    return delayPromise(GEOJSON_FETCH_RETRY_DELAY_MS * attempt).then(function () {
                        return once(attempt + 1);
                    });
                });
        }
        return once(1);
    }

    function installSigVectorLayer(spec, group, data) {
        if (spec.label === 'Baseflow' || spec.label === 'Cross-process dominance') {
            trySetInitialExtentFromGeojson(data);
        }
        if (spec.isCrossProcess) {
            normalizeCrossProcessDominanceProps(data);
        }
        if (spec.legendKind === 'groupMax') {
            spec._groupMaxLegendRows = collectGroupMaxLegendRows(data);
        }

        var vtStyles = {};
        var styleFn = spec.isCrossProcess ? crossProcessStyleFromProps : pathStyleFromProps;
        vtStyles[vectorTileLayerName] = function (properties, zoom) {
            return styleFn(properties, zoom);
        };

        var vectorLayer = L.vectorGrid.slicer(data, {
            rendererFactory: L.canvas.tile,
            pane: 'overlayPane',
            interactive: true,
            vectorTileLayerName: vectorTileLayerName,
            getFeatureId: function (feat) {
                var g = feat.properties && feat.properties.gauge_id;
                return g != null && g !== '' ? String(g) : '_';
            },
            maxZoom: 16,
            tolerance: 3,
            buffer: 64,
            vectorTileLayerStyles: vtStyles
        });

        vectorLayer.on('click', function (e) {
            var lyr = e.layer || e.propagatedFrom;
            var props = lyr && (lyr.properties || lyr.feature && lyr.feature.properties);
            if (!props) return;
            L.popup({ maxWidth: 340, autoPan: true, keepInView: true })
                .setLatLng(e.latlng)
                .setContent(buildPopupHtml(spec.label, props))
                .openOn(map);
        });

        vectorLayer.addTo(group);

        loadedSigLayers.push({
            group: group,
            vectorLayer: vectorLayer,
            data: data,
            label: spec.label,
            isCrossProcess: !!spec.isCrossProcess
        });

        if (spec.label === 'Cross-process dominance') {
            group.addTo(map);
        }
        updateSignatureLegendVisibility();
        console.log('Loaded vector layer:', spec.label);
    }

    /** One request at a time avoids parallel multi‑MB downloads stalling or truncating (e.g. Overland flow ~15 MB). */
    var layerLoadChain = Promise.resolve();
    layerSpecs.forEach(function (spec) {
        var group = L.layerGroup();
        overlayMaps[spec.label] = group;
        layerLoadChain = layerLoadChain.then(function () {
            return fetchGeoJsonWithRetries(spec.path).then(function (data) {
                installSigVectorLayer(spec, group, data);
            }).catch(function (err) {
                console.error(err);
                alert('Failed to load ' + spec.label + ': ' + err.message);
            });
        });
    });

    var SIG_MAP_MOBILE_MQ = '(max-width: 768px)';

    function isSigMapMobileViewport() {
        return window.matchMedia(SIG_MAP_MOBILE_MQ).matches;
    }

    var sigLayersControl = null;
    function attachSigLayersControl() {
        if (sigLayersControl) {
            map.removeControl(sigLayersControl);
            sigLayersControl = null;
        }
        sigLayersControl = L.control.layers(baseMaps, overlayMaps, {
            collapsed: isSigMapMobileViewport()
        }).addTo(map);
        setTimeout(syncSignatureOverlayCheckboxes, 0);
    }

    attachSigLayersControl();
    var sigMapMobileMql = window.matchMedia(SIG_MAP_MOBILE_MQ);
    if (typeof sigMapMobileMql.addEventListener === 'function') {
        sigMapMobileMql.addEventListener('change', attachSigLayersControl);
    } else if (typeof sigMapMobileMql.addListener === 'function') {
        sigMapMobileMql.addListener(attachSigLayersControl);
    }

    /** Signature overlays (layerSpecs) are mutually exclusive: turning one on removes the others. Basemaps unchanged. */
    function isSignatureOverlayLabel(name) {
        for (var si = 0; si < layerSpecs.length; si++) {
            if (layerSpecs[si].label === name) return true;
        }
        return false;
    }

    /** Leaflet sometimes leaves overlay checkboxes out of sync when removeLayer runs inside overlayadd; force match to map. */
    function syncSignatureOverlayCheckboxes() {
        var root = document.querySelector('#map .leaflet-control-layers-overlays');
        if (!root) return;
        var labels = root.querySelectorAll('label');
        var specCount = layerSpecs.length;
        if (labels.length === specCount) {
            for (var k = 0; k < specCount; k++) {
                var inp = labels[k].querySelector('input[type="checkbox"]');
                if (!inp) continue;
                var grp = overlayMaps[layerSpecs[k].label];
                inp.checked = !!(grp && map.hasLayer(grp));
            }
        } else {
            for (var i = 0; i < labels.length; i++) {
                var lab = labels[i];
                var input = lab.querySelector('input[type="checkbox"]');
                if (!input) continue;
                var nameNode = lab.querySelector('span');
                var t = nameNode ? nameNode.textContent.replace(/\s+/g, ' ').trim() : '';
                for (var j = 0; j < specCount; j++) {
                    var nl = layerSpecs[j].label.replace(/\s+/g, ' ').trim();
                    if (t === nl) {
                        var g = overlayMaps[layerSpecs[j].label];
                        input.checked = !!(g && map.hasLayer(g));
                        break;
                    }
                }
            }
        }
    }

    map.on('overlayadd', function (e) {
        var name = e && e.name;
        if (!name && e && e.layer) {
            for (var key in overlayMaps) {
                if (Object.prototype.hasOwnProperty.call(overlayMaps, key) && overlayMaps[key] === e.layer) {
                    name = key;
                    break;
                }
            }
        }
        if (!name || !isSignatureOverlayLabel(name)) return;
        function deactivateOthers() {
            for (var si = 0; si < layerSpecs.length; si++) {
                var lbl = layerSpecs[si].label;
                if (lbl === name) continue;
                var grp = overlayMaps[lbl];
                if (grp && map.hasLayer(grp)) {
                    map.removeLayer(grp);
                }
            }
            syncSignatureOverlayCheckboxes();
        }
        setTimeout(deactivateOthers, 0);
    });

    map.on('overlayremove', function (e) {
        var name = e && e.name;
        if (!name && e && e.layer) {
            for (var key2 in overlayMaps) {
                if (Object.prototype.hasOwnProperty.call(overlayMaps, key2) && overlayMaps[key2] === e.layer) {
                    name = key2;
                    break;
                }
            }
        }
        if (!name || !isSignatureOverlayLabel(name)) return;
        setTimeout(syncSignatureOverlayCheckboxes, 0);
    });

    var signatureLegendControl = L.control({ position: 'bottomright' });
    signatureLegendControl.onAdd = function () {
        var div = L.DomUtil.create('div', 'sig-bivariate-legend-wrap');
        div.style.display = 'none';
        legendImagesEl = L.DomUtil.create('div', 'sig-legend-images', div);
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        legendWrapEl = div;
        return div;
    };
    signatureLegendControl.addTo(map);
    map.on('overlayadd overlayremove', updateSignatureLegendVisibility);
    updateSignatureLegendVisibility();

    document.getElementById('gaugeIdSearchButton').addEventListener('click', performGaugeSearch);
    document.getElementById('gaugeIdSearchInput').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') performGaugeSearch();
    });
</script>

</body>
</html>
